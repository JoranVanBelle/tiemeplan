name: Release new version
run-name: Release ${{ inputs.type_of_release }} version by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      type_of_release:
        description: type of release
        required: true
        default: minor (0.x.0)
        type: choice
        options:
          - major (x.0.0)
          - minor (0.x.0)
          - patch (0.0.x)

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Builds and tests the application images with the new version baked in.
  # Nothing is committed or tagged yet, so a failing build leaves the repository untouched.
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
          - os: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    outputs:
      # Every platform computes the same version.
      version: ${{ steps.bump_version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Get current version
        id: get_version
        run: |
          CURRENT_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Current version: $CURRENT_VERSION"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Increment version
        id: bump_version
        env:
          CURRENT_VERSION: ${{ steps.get_version.outputs.current_version }}
          TYPE_OF_RELEASE: ${{ inputs.type_of_release }}
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          case "$TYPE_OF_RELEASE" in
            "major (x.0.0)")
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            "minor (0.x.0)")
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            "patch (0.0.x)")
              PATCH=$((PATCH + 1))
              ;;
            *)
              echo "Unknown release type"
              exit 1
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set new version
        run: ./mvnw -B versions:set -DnewVersion=${{ steps.bump_version.outputs.new_version }}

      - name: Install virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # The JavaFX tests need a display, so the build runs inside a virtual one.
      - name: Test and build application image (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./mvnw -B clean verify -Papp-image

      # Tests run on Linux only; the other platforms just package the application.
      - name: Build application image (Windows)
        if: runner.os == 'Windows'
        run: ./mvnw -B clean package -Papp-image -DskipTests

      # macOS rejects application versions starting with 0, so 0.x.y is packaged as 1.x.y.
      # This only affects the bundle metadata; the application itself reports the real version.
      - name: Build application image (macOS)
        if: runner.os == 'macOS'
        env:
          NEW_VERSION: ${{ steps.bump_version.outputs.new_version }}
        run: |
          BUNDLE_VERSION="$NEW_VERSION"
          if [[ "$NEW_VERSION" == 0.* ]]; then
            BUNDLE_VERSION="1.${NEW_VERSION#0.}"
          fi
          ./mvnw -B clean package -Papp-image -DskipTests -Djpackage.app.version="$BUNDLE_VERSION"

      - name: Archive application image (Linux)
        if: runner.os == 'Linux'
        working-directory: target/app-image/dist
        run: tar -czf "Tiemeplan-${{ steps.bump_version.outputs.new_version }}-${{ matrix.platform }}.tar.gz" Tiemeplan

      - name: Zip application image (Windows)
        if: runner.os == 'Windows'
        working-directory: target/app-image/dist
        run: 7z a -tzip "Tiemeplan-${{ steps.bump_version.outputs.new_version }}-${{ matrix.platform }}.zip" Tiemeplan

      # ditto keeps the symlinks and permissions inside the .app bundle intact.
      - name: Zip application image (macOS)
        if: runner.os == 'macOS'
        working-directory: target/app-image/dist
        run: ditto -c -k --keepParent Tiemeplan.app "Tiemeplan-${{ steps.bump_version.outputs.new_version }}-${{ matrix.platform }}.zip"

      - name: Upload application archive
        uses: actions/upload-artifact@v4
        with:
          name: app-image-${{ matrix.platform }}
          path: |
            target/app-image/dist/*.tar.gz
            target/app-image/dist/*.zip
          if-no-files-found: error

  # Commits the version bump and tags it.
  release:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # IMPORTANT: needed for tags

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Set new version
        run: ./mvnw -B versions:set -DnewVersion=${{ needs.package.outputs.version }}

      - name: Commit and tag
        env:
          NEW_VERSION: ${{ needs.package.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): bump version to $NEW_VERSION"
          git tag "v$NEW_VERSION"
          git push --atomic origin HEAD "v$NEW_VERSION"

  # Creates the GitHub release with changelog and application archives.
  publish:
    runs-on: ubuntu-latest
    needs: [package, release]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v${{ needs.package.outputs.version }}

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Download application archives
        uses: actions/download-artifact@v4
        with:
          pattern: app-image-*
          merge-multiple: true
          path: target/app-image/dist/

      - name: Release with JReleaser
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B -Prelease jreleaser:full-release

      - name: Upload JReleaser logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-logs
          path: |
            target/jreleaser/trace.log
            target/jreleaser/output.properties
